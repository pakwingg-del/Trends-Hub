name: Fetch US Trends

# Outside schedule POSTs workflow_dispatch ~UTC 00/03/06/21 (4x/day).
# No in-repo cron (that used to stack HKT 09/14/20 on top).
# Tech SerpAPI is daily-only inside fetch_trends.py; other niches run every dispatch.
on:
  workflow_dispatch:
  repository_dispatch:
    types: [fetch_trends]

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pip install requests

      - name: Fetch Latest Trends
        env:
          SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
        run: python fetch_trends.py

      - name: Commit & Push Updated Trends
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto: Update US trend JSON files (SerpAPI)"
          file_pattern: master_trends.json trends_finance.json trends_tech.json trends_entertainment.json
